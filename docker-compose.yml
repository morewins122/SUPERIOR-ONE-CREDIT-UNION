version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: superior_one_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superior_one_cu}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: superior_one_api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/superior_one_cu?schema=public
      PORT: 4000
      NODE_ENV: development
      WEB_URL: http://localhost:5173
      JWT_SECRET: change-me-in-dev-mode
      JWT_EXPIRES_IN: 1d
      BCRYPT_ROUNDS: 10
      ENABLE_MOCK_2FA: true
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: superior_one_web
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  postgres_data:
